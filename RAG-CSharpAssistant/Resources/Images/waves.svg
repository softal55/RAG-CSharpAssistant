<?xml version="1.0" encoding="UTF-8"?>
<!--
  Decorative bottom ribbon for the LoadingPage splash.
  Five layered flowing curves + subtle particles, all using the lavender/violet
  palette (#A58FE0 / #6C63FF) at low opacity so they sit gently behind the title
  and don't compete with the C# hex logo. Edge-fade gradients keep the curves
  from harshly clipping at the screen sides.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 600"
     preserveAspectRatio="xMidYMax slice">

    <defs>
        <linearGradient id="lavenderFade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"    stop-color="#A58FE0" stop-opacity="0" />
            <stop offset="0.18" stop-color="#A58FE0" stop-opacity="1" />
            <stop offset="0.82" stop-color="#A58FE0" stop-opacity="1" />
            <stop offset="1"    stop-color="#A58FE0" stop-opacity="0" />
        </linearGradient>

        <linearGradient id="violetFade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"    stop-color="#6C63FF" stop-opacity="0" />
            <stop offset="0.22" stop-color="#6C63FF" stop-opacity="1" />
            <stop offset="0.78" stop-color="#6C63FF" stop-opacity="1" />
            <stop offset="1"    stop-color="#6C63FF" stop-opacity="0" />
        </linearGradient>
    </defs>

    <!-- Flowing curves -->
    <g fill="none" stroke-linecap="round">
        <path d="M -40,260 Q 220,120 520,260 T 1080,220 T 1340,270"
              stroke="url(#lavenderFade)" stroke-width="2"   opacity="0.35" />

        <path d="M -40,340 Q 260,210 560,340 T 1140,320 T 1340,360"
              stroke="url(#violetFade)"   stroke-width="2.4" opacity="0.28" />

        <path d="M -40,430 Q 300,310 620,430 T 1200,410 T 1340,450"
              stroke="url(#lavenderFade)" stroke-width="2.2" opacity="0.30" />

        <path d="M -40,520 Q 350,420 660,520 T 1240,500 T 1340,530"
              stroke="url(#violetFade)"   stroke-width="1.5" opacity="0.20" />

        <!-- Cross-wisp running just above the main band, breaks the parallel feel -->
        <path d="M 180,200 Q 400,90 620,200 T 1020,220"
              stroke="url(#lavenderFade)" stroke-width="1.8" opacity="0.25" />
    </g>

    <!-- Floating particles -->
    <g fill="#A58FE0">
        <circle cx="180"  cy="170" r="1.8" opacity="0.55" />
        <circle cx="320"  cy="210" r="1.2" opacity="0.45" />
        <circle cx="480"  cy="150" r="1.5" opacity="0.55" />
        <circle cx="650"  cy="225" r="1.3" opacity="0.45" />
        <circle cx="820"  cy="175" r="1.6" opacity="0.55" />
        <circle cx="980"  cy="245" r="1.2" opacity="0.45" />
        <circle cx="280"  cy="285" r="1.0" opacity="0.40" />
        <circle cx="720"  cy="320" r="1.4" opacity="0.50" />
        <circle cx="1100" cy="180" r="1.3" opacity="0.45" />
    </g>
</svg>
